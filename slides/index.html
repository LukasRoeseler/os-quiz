<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>MüCOS Open Science: Folien</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="slide-app"></div>

<script src="slides-data.js"></script>
<script src="slides-common.js"></script>
<script>
(function () {
  'use strict';

  const SLIDES = window.MUCOS_SLIDES || [];
  const COMMON = window.MUCOS_SLIDES_COMMON;
  const params = new URLSearchParams(window.location.search);
  const frozenParam = params.get('slide');
  const isFrozen = frozenParam !== null;
  let index = isFrozen ? Math.max(0, Math.min(SLIDES.length - 1, parseInt(frozenParam, 10) || 0)) : COMMON.getIndex(SLIDES.length);

  const app = document.getElementById('slide-app');

  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(k => {
        if (k === 'class') node.className = attrs[k];
        else if (k === 'text') node.textContent = attrs[k];
        else if (k === 'html') node.innerHTML = attrs[k];
        else if (k.startsWith('on') && typeof attrs[k] === 'function') node.addEventListener(k.slice(2), attrs[k]);
        else node.setAttribute(k, attrs[k]);
      });
    }
    (children || []).forEach(c => { if (c) node.appendChild(c); });
    return node;
  }

  function render() {
    const slide = SLIDES[index] || SLIDES[0];
    app.innerHTML = '';

    const wrapChildren = [
      el('div', { class: 'sl-section-label', text: slide.section || '' }),
      el('h1', { class: 'sl-title', text: slide.title || '' }),
      el('div', { class: 'sl-body' }, [
        el('div', {}, [el('ul', { class: 'sl-bullets' }, (slide.bullets || []).map(b => el('li', { text: b })))]),
        slide.figure && COMMON.FIGURES[slide.figure]
          ? el('div', { class: 'sl-figure-wrap', html: COMMON.FIGURES[slide.figure] })
          : null,
      ]),
    ];
    if (slide.refs && slide.refs.length) {
      wrapChildren.push(el('div', { class: 'sl-refs' }, slide.refs.map(r =>
        el('a', { href: r.url, target: '_blank', rel: 'noopener', text: r.label })
      )));
    }

    const stage = el('div', { class: 'sl-stage' }, [
      el('div', { class: 'sl-slide' }, wrapChildren),
    ]);

    if (isFrozen) {
      app.appendChild(stage);
      return;
    }

    const progressPct = SLIDES.length > 1 ? Math.round((index / (SLIDES.length - 1)) * 100) : 0;
    app.appendChild(el('header', { class: 'sl-topbar' }, [
      el('div', { class: 'sl-brand-group' }, [
        el('img', { class: 'sl-logo', src: '../assets/mucos-logo.jpg', alt: 'MüCOS' }),
        el('div', { class: 'sl-brand', text: `Folie ${index + 1} / ${SLIDES.length}` }),
      ]),
    ]));
    app.appendChild(el('div', { class: 'sl-progress-track' }, [
      el('div', { class: 'sl-progress-fill', style: `width:${progressPct}%` }),
    ]));
    app.appendChild(stage);
  }

  function goTo(i) {
    if (isFrozen) return;
    index = COMMON.setIndex(i, SLIDES.length);
    render();
  }

  if (!isFrozen) {
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); goTo(index + 1); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); goTo(index - 1); }
      else if (e.key === 'Home') { e.preventDefault(); goTo(0); }
      else if (e.key === 'End') { e.preventDefault(); goTo(SLIDES.length - 1); }
    });
    document.addEventListener('click', e => {
      if (e.target.closest('a')) return;
      const rect = document.body.getBoundingClientRect();
      const mid = rect.width / 2;
      if (e.clientX < mid) goTo(index - 1); else goTo(index + 1);
    });
    COMMON.onIndexChange(() => {
      index = COMMON.getIndex(SLIDES.length);
      render();
    });
  }

  render();
})();
</script>
</body>
</html>
