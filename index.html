<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>MüCOS Open Science Quiz</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root {
    --os-text: #2b333c;
    --os-text-secondary: #6c7884;
    --os-border: #d9e0e6;
    --os-bg-subtle: #f4f7f9;
    --os-track: #e8eef2;
    --os-white: #ffffff;
    --os-accent: #1583ad;
    --os-accent-hover: #0f6f96;
    --os-accent-bar: #1BA3D1;
    --os-success: #2f8f4e;
    --os-success-bg: #eaf6ee;
    --os-danger: #b23a3a;
    --os-danger-bg: #fbecec;
  }

  * , *::before, *::after { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow-x: hidden;
  }

  body {
    font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
    background: var(--os-bg-subtle);
    color: var(--os-text);
    line-height: 1.5;
  }

  #app {
    min-height: 100dvh;
    width: 100%;
    display: flex;
    flex-direction: column;
  }

  header.os-header {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    padding: 0.9rem 1.5rem;
    background: var(--os-white);
    border-bottom: 1px solid var(--os-border);
  }

  .os-brand {
    font-size: 15px;
    font-weight: 700;
    color: var(--os-text);
    white-space: nowrap;
  }

  .os-header-right {
    display: flex;
    align-items: center;
    gap: 1.1rem;
    flex-wrap: wrap;
  }

  .os-header-stats {
    display: flex;
    gap: 1.1rem;
    align-items: baseline;
  }
  .os-header-stat {
    text-align: right;
  }
  .os-header-stat-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--os-text-secondary);
  }
  .os-header-stat-value {
    font-size: 18px;
    font-weight: 700;
    color: var(--os-text);
  }

  button.os-lang-btn {
    all: unset;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border: 1.5px solid var(--os-border);
    border-radius: 4px;
    color: var(--os-text-secondary);
    font-size: 12px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    line-height: 1;
  }
  button.os-lang-btn:hover { border-color: var(--os-accent); color: var(--os-accent); }
  button.os-lang-btn svg { display: block; }

  button.os-debug-btn {
    all: unset;
    padding: 6px 10px;
    border: 1.5px dashed var(--os-danger);
    border-radius: 4px;
    color: var(--os-danger);
    font-size: 11px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }

  .os-progress-track {
    flex: 0 0 auto;
    height: 4px;
    background: var(--os-track);
  }
  .os-progress-fill {
    height: 100%;
    background: var(--os-accent-bar);
    transition: width 0.25s ease;
  }

  main.os-main {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 1.5rem 1rem 2.5rem;
    overflow-y: auto;
    overflow-x: hidden;
  }

  .os-card {
    width: 100%;
    max-width: 640px;
    min-width: 0;
    margin-top: 1rem;
  }

  .os-panel {
    background: var(--os-white);
    border: 1px solid var(--os-border);
    border-radius: 8px;
    padding: 1.6rem 1.6rem;
    min-width: 0;
    overflow-wrap: break-word;
  }

  .os-intro {
    position: relative;
    overflow: hidden;
    background: var(--os-bg-subtle);
    border: 1px solid var(--os-border);
    border-radius: 8px;
    padding: 1.2rem 1.4rem 1.2rem 1.5rem;
    margin-bottom: 1.4rem;
    font-size: 13.5px;
    color: var(--os-text);
  }
  .os-intro::before {
    content: "";
    position: absolute; top: 0; left: 0; bottom: 0; width: 5px;
    background: var(--os-accent-bar);
  }
  .os-intro p { margin: 0; }

  h1.os-title {
    font-size: 22px;
    margin: 0 0 1rem;
    color: var(--os-text);
  }

  label.os-label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--os-text-secondary);
    margin-bottom: 0.4rem;
  }

  input.os-input {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid #b9c4cd;
    border-radius: 4px;
    font-size: 15px;
    font-family: inherit;
    color: var(--os-text);
    background: var(--os-white);
    outline: none;
  }
  input.os-input:focus { border-color: var(--os-accent); }

  button.os-btn-primary {
    all: unset;
    display: inline-block;
    padding: 11px 26px;
    background: var(--os-accent);
    color: var(--os-white);
    border-radius: 4px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    transition: background 0.12s;
  }
  button.os-btn-primary:hover { background: var(--os-accent-hover); }
  button.os-btn-primary:disabled {
    background: #b9c4cd;
    cursor: not-allowed;
  }

  button.os-btn-secondary {
    all: unset;
    display: inline-block;
    padding: 10px 22px;
    background: var(--os-white);
    color: var(--os-accent);
    border: 1.5px solid var(--os-accent);
    border-radius: 4px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
  }
  button.os-btn-secondary:hover { background: var(--os-bg-subtle); }

  .os-btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 0.4rem; }

  .os-category-heading {
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--os-accent);
    margin: 0 0 0.6rem;
  }

  .os-question-text {
    font-size: 17px;
    font-weight: 700;
    color: var(--os-text);
    margin: 0 0 1.2rem;
    overflow-wrap: break-word;
  }

  .os-multi-hint {
    font-size: 12px;
    color: var(--os-text-secondary);
    font-style: italic;
    margin: -0.7rem 0 1rem;
  }

  .os-choices { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.3rem; min-width: 0; }

  button.os-choice {
    all: unset;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    align-self: stretch;
    gap: 12px;
    max-width: 100%;
    min-width: 0;
    min-height: 48px;
    padding: 12px 16px;
    border: 1.5px solid var(--os-border);
    border-radius: 6px;
    background: var(--os-white);
    font-family: inherit;
    font-size: 14.5px;
    color: var(--os-text);
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  button.os-choice:hover { border-color: var(--os-accent); }
  button.os-choice.selected {
    border-color: var(--os-accent);
    background: #eaf5fa;
  }
  button.os-choice.correct {
    border-color: var(--os-success);
    background: var(--os-success-bg);
  }
  button.os-choice.incorrect {
    border-color: var(--os-danger);
    background: var(--os-danger-bg);
  }
  button.os-choice:disabled { cursor: default; }

  .os-choice-text {
    flex: 1 1 auto;
    min-width: 0;
    overflow-wrap: break-word;
    word-break: break-word;
  }

  .os-choice-letter {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--os-border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--os-text-secondary);
  }
  button.os-choice.selected .os-choice-letter {
    border-color: var(--os-accent);
    color: var(--os-accent);
  }
  button.os-choice.correct .os-choice-letter {
    border-color: var(--os-success);
    color: var(--os-success);
  }
  button.os-choice.incorrect .os-choice-letter {
    border-color: var(--os-danger);
    color: var(--os-danger);
  }

  .os-feedback {
    border-radius: 6px;
    padding: 0.9rem 1.1rem;
    font-size: 13.5px;
    margin-bottom: 1.2rem;
    overflow-wrap: break-word;
  }
  .os-feedback.correct { background: var(--os-success-bg); color: #1d5c33; border: 1px solid #bfe3cb; }
  .os-feedback.incorrect { background: var(--os-danger-bg); color: #7a2727; border: 1px solid #e9c3c3; }
  .os-feedback-title { font-weight: 700; margin-bottom: 0.3rem; }

  .os-streak-note {
    font-size: 12px;
    color: var(--os-accent);
    font-weight: 700;
    margin-bottom: 1rem;
  }

  /* Results screen */
  .os-summary {
    background: var(--os-white);
    border: 2px solid var(--os-accent);
    border-radius: 6px;
    padding: 1.2rem 1.5rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 2px 10px rgba(21,131,173,0.09);
  }
  .os-summary-header {
    font-size: 10px; font-weight: 700; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--os-accent); margin-bottom: 0.9rem;
  }
  .os-stats { display: flex; gap: 0; flex-wrap: wrap; }
  .os-stat { padding-right: 1.6rem; margin-right: 1.6rem; border-right: 1px solid var(--os-border); margin-bottom: 0.5rem; }
  .os-stat:last-child { border-right: none; margin-right: 0; padding-right: 0; }
  .os-stat-label { font-size: 11px; color: var(--os-text-secondary); margin-bottom: 1px; white-space: nowrap; }
  .os-stat-value { font-size: 30px; font-weight: 700; color: var(--os-text); line-height: 1.1; }

  .os-section-title {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--os-text-secondary);
    margin: 1.6rem 0 0.8rem;
  }

  .os-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .os-bar-label { flex: 0 0 auto; width: 168px; font-size: 12.5px; color: var(--os-text); }
  .os-bar-track { flex: 1 1 auto; min-width: 0; height: 12px; background: var(--os-track); border-radius: 6px; overflow: hidden; }
  .os-bar-fill { height: 100%; background: var(--os-accent-bar); border-radius: 6px; }
  .os-bar-pct { flex: 0 0 auto; width: 38px; text-align: right; font-size: 12px; font-weight: 700; color: var(--os-text-secondary); }

  table.os-leaderboard {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.os-leaderboard th {
    text-align: left;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--os-text-secondary);
    background: var(--os-bg-subtle);
    padding: 8px 10px;
    border-bottom: 1px solid var(--os-border);
  }
  table.os-leaderboard td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--os-border);
  }
  table.os-leaderboard tr.os-me td { font-weight: 700; background: #eaf5fa; }

  .os-info-note {
    font-size: 12.5px;
    color: var(--os-text-secondary);
    font-style: italic;
    padding: 0.7rem 0;
  }

  @media (max-width: 600px) {
    header.os-header { padding: 0.7rem 1rem; }
    .os-brand { font-size: 13px; }
    .os-header-right { gap: 0.7rem; }
    .os-header-stats { gap: 0.8rem; }
    .os-header-stat-value { font-size: 15px; }
    main.os-main { padding: 1rem 0.75rem 2rem; }
    .os-panel { padding: 1.2rem 1.1rem; }
    h1.os-title { font-size: 19px; }
    .os-question-text { font-size: 15.5px; }
    .os-bar-label { width: 108px; font-size: 11.5px; }
    .os-stat-value { font-size: 24px; }
    .os-stat { padding-right: 1rem; margin-right: 1rem; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="questions.js"></script>
<script>
(function () {
  'use strict';

  // Injected at Pages build time by .github/workflows/deploy.yml.
  // Left as-is, the app runs fully in local demo mode.
  const SHEET_WEBHOOK_URL = '__SHEET_WEBHOOK_URL__';

  function isSheetConfigured() {
    return typeof SHEET_WEBHOOK_URL === 'string' && SHEET_WEBHOOK_URL.length > 0 && !SHEET_WEBHOOK_URL.startsWith('__');
  }

  const DIFFICULTY_POINTS = { leicht: 1, mittel: 2, schwer: 3 };

  const STRINGS = {
    de: {
      langCode: 'DE',
      brand: 'MüCOS Open Science Quiz',
      introText: 'Ein anspruchsvolles Multiple-Choice-Quiz auf Basis der MüCOS-Infomodule der Universität Münster.',
      nicknameLabel: 'Ihr Spitzname für das Leaderboard',
      nicknamePlaceholder: 'z. B. OpenOwl42',
      startBtn: 'Quiz starten',
      questionOf: (i, n) => `Frage ${i} von ${n}`,
      pointsLabel: 'Punkte',
      streakLabel: 'Serie',
      confirmBtn: 'Antwort bestätigen',
      nextBtn: 'Weiter',
      finishBtn: 'Ergebnis anzeigen',
      correctFeedback: 'Richtig!',
      incorrectFeedback: 'Nicht ganz.',
      streakNote: n => `Serie: ${n} richtige Antworten in Folge.`,
      multiHint: 'Mehrere Antworten möglich.',
      resultTitle: 'Ihr Ergebnis',
      percentLabel: 'Prozent',
      percentileLabel: 'Perzentile',
      durationLabel: 'Dauer',
      percentileText: p => `Besser als ${p}% der bisherigen Teilnehmenden.`,
      percentileLoading: 'Perzentile wird berechnet.',
      percentileUnavailable: 'Noch nicht mit einem Google Sheet verbunden. Perzentile und Leaderboard sind im Demo-Modus nicht verfügbar.',
      categoryBreakdownTitle: 'Ergebnis nach Kategorie',
      leaderboardTitle: 'Leaderboard (Top 10)',
      leaderboardLoading: 'Leaderboard wird geladen.',
      leaderboardUnavailable: 'Leaderboard aktuell nicht verfügbar.',
      retryBtn: 'Nochmal spielen',
      summaryBtn: 'Zusammenfassung öffnen',
      debugBtn: 'Debug: Zum Ergebnis springen',
      tableRank: '#',
      tableName: 'Spitzname',
      tableResult: 'Ergebnis',
      durationFormat: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`),
      summaryTitle: 'Zusammenfassung: Open Science Quiz',
      summaryPlayer: 'Spieler*in',
      summaryScore: 'Ergebnis',
      summaryYourAnswer: 'Ihre Antwort',
      summaryCorrectAnswer: 'Richtige Antwort',
      summaryCorrect: 'Richtig',
      summaryIncorrect: 'Falsch',
    },
    en: {
      langCode: 'EN',
      brand: 'MüCOS Open Science Quiz',
      introText: 'A challenging multiple-choice quiz based on the MüCOS modules of the University of Münster.',
      nicknameLabel: 'Your nickname for the leaderboard',
      nicknamePlaceholder: 'e.g. OpenOwl42',
      startBtn: 'Start quiz',
      questionOf: (i, n) => `Question ${i} of ${n}`,
      pointsLabel: 'Points',
      streakLabel: 'Streak',
      confirmBtn: 'Confirm answer',
      nextBtn: 'Next',
      finishBtn: 'Show result',
      correctFeedback: 'Correct!',
      incorrectFeedback: 'Not quite.',
      streakNote: n => `Streak: ${n} correct answers in a row.`,
      multiHint: 'Multiple answers possible.',
      resultTitle: 'Your Result',
      percentLabel: 'Percent',
      percentileLabel: 'Percentile',
      durationLabel: 'Duration',
      percentileText: p => `Better than ${p}% of previous participants.`,
      percentileLoading: 'Calculating percentile.',
      percentileUnavailable: 'Not yet connected to a Google Sheet. Percentile and leaderboard are unavailable in demo mode.',
      categoryBreakdownTitle: 'Result by Category',
      leaderboardTitle: 'Leaderboard (Top 10)',
      leaderboardLoading: 'Loading leaderboard.',
      leaderboardUnavailable: 'Leaderboard currently unavailable.',
      retryBtn: 'Play again',
      summaryBtn: 'Open summary',
      debugBtn: 'Debug: jump to result',
      tableRank: '#',
      tableName: 'Nickname',
      tableResult: 'Score',
      durationFormat: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`),
      summaryTitle: 'Summary: Open Science Quiz',
      summaryPlayer: 'Player',
      summaryScore: 'Score',
      summaryYourAnswer: 'Your answer',
      summaryCorrectAnswer: 'Correct answer',
      summaryCorrect: 'Correct',
      summaryIncorrect: 'Incorrect',
    },
  };

  function getLang() {
    return (localStorage.getItem('osQuizLang') === 'en') ? 'en' : 'de';
  }
  function t(key, ...args) {
    const entry = STRINGS[state.lang][key];
    return typeof entry === 'function' ? entry(...args) : entry;
  }

  function getSessionId() {
    let id = localStorage.getItem('osQuizSessionId');
    if (!id) {
      id = (crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
      localStorage.setItem('osQuizSessionId', id);
    }
    return id;
  }

  function shuffledOrder(n) {
    // Fixed question set, but presented in a stable per-visitor shuffle so
    // browsing the DOM source doesn't trivially reveal answer order.
    const arr = Array.from({ length: n }, (_, i) => i);
    let seed = 0;
    const sid = getSessionId();
    for (let i = 0; i < sid.length; i++) seed = (seed * 31 + sid.charCodeAt(i)) >>> 0;
    for (let i = arr.length - 1; i > 0; i--) {
      seed = (seed * 1103515245 + 12345) >>> 0;
      const j = seed % (i + 1);
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  const QUESTIONS = window.OS_QUIZ_QUESTIONS || [];
  const CATEGORY_KEYS = window.OS_QUIZ_CATEGORY_KEYS || [];
  const CATEGORY_LABELS = window.OS_QUIZ_CATEGORY_LABELS || { de: {}, en: {} };
  const MAX_SCORE = QUESTIONS.reduce((sum, q) => sum + DIFFICULTY_POINTS[q.difficulty], 0);

  function categoryLabel(key) {
    return (CATEGORY_LABELS[state.lang] && CATEGORY_LABELS[state.lang][key]) || key;
  }

  const state = {
    lang: getLang(),
    screen: 'start',
    nickname: '',
    order: [],
    index: 0,
    selected: new Set(),
    locked: false,
    score: 0,
    streak: 0,
    perCategory: {},
    history: [],
    startTime: null,
    percentile: null,
    leaderboard: null,
    leaderboardStatus: 'idle', // idle | loading | ready | unavailable
  };

  const app = document.getElementById('app');

  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(k => {
        if (k === 'class') node.className = attrs[k];
        else if (k === 'text') node.textContent = attrs[k];
        else if (k === 'html') node.innerHTML = attrs[k];
        else if (k.startsWith('on') && typeof attrs[k] === 'function') node.addEventListener(k.slice(2), attrs[k]);
        else if (typeof attrs[k] === 'boolean') { if (attrs[k]) node.setAttribute(k, ''); else node.removeAttribute(k); }
        else node.setAttribute(k, attrs[k]);
      });
    }
    (children || []).forEach(c => { if (c) node.appendChild(c); });
    return node;
  }

  const SPEECH_BUBBLE_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>';

  function langToggleButton() {
    return el('button', { class: 'os-lang-btn', type: 'button', title: 'DE / EN', onclick: toggleLanguage }, [
      el('span', { html: SPEECH_BUBBLE_SVG }),
      el('span', { text: t('langCode') }),
    ]);
  }

  function toggleLanguage() {
    state.lang = state.lang === 'de' ? 'en' : 'de';
    localStorage.setItem('osQuizLang', state.lang);
    render();
  }

  function isDebugUser() {
    return state.nickname.trim().toLowerCase() === 'test';
  }

  function debugButton() {
    if (!isDebugUser()) return null;
    return el('button', { class: 'os-debug-btn', type: 'button', onclick: jumpToEnd, text: t('debugBtn') });
  }

  function jumpToEnd() {
    if (state.screen !== 'quiz' && state.screen !== 'start') return;
    if (state.screen === 'start') {
      state.nickname = state.nickname.trim() || 'test';
      state.order = shuffledOrder(QUESTIONS.length);
      state.index = 0;
      state.selected = new Set();
      state.locked = false;
      state.score = 0;
      state.streak = 0;
      state.perCategory = {};
      state.history = [];
      CATEGORY_KEYS.forEach(k => { state.perCategory[k] = { score: 0, max: 0 }; });
      state.startTime = Date.now();
    }
    finishQuiz();
  }

  function render() {
    app.innerHTML = '';
    if (state.screen === 'start') app.appendChild(renderStart());
    else if (state.screen === 'quiz') app.appendChild(renderQuiz());
    else app.appendChild(renderResults());
  }

  function renderStart() {
    const headerRight = el('div', { class: 'os-header-right' }, [debugButton(), langToggleButton()]);
    const wrap = el('div', { id: 'app-start' }, [
      el('header', { class: 'os-header' }, [
        el('div', { class: 'os-brand', text: t('brand') }),
        headerRight,
      ]),
      el('main', { class: 'os-main' }, [
        el('div', { class: 'os-card' }, [
          el('div', { class: 'os-panel' }, [
            el('h1', { class: 'os-title', text: t('brand') }),
            el('div', { class: 'os-intro' }, [
              el('p', { text: t('introText') }),
            ]),
            el('label', { class: 'os-label', for: 'os-nickname-input', text: t('nicknameLabel') }),
            (function () {
              const input = el('input', { class: 'os-input', id: 'os-nickname-input', type: 'text', maxlength: '30', placeholder: t('nicknamePlaceholder') });
              input.value = state.nickname;
              input.addEventListener('input', e => { state.nickname = e.target.value; });
              input.addEventListener('keydown', e => { if (e.key === 'Enter') startQuiz(); });
              setTimeout(() => input.focus(), 0);
              return input;
            })(),
            el('div', { class: 'os-btn-row' }, [
              el('button', { class: 'os-btn-primary', text: t('startBtn'), onclick: startQuiz }),
            ]),
          ]),
        ]),
      ]),
    ]);
    return wrap;
  }

  function startQuiz() {
    const name = state.nickname.trim();
    if (!name) {
      const input = document.getElementById('os-nickname-input');
      if (input) { input.style.borderColor = 'var(--os-danger, #b23a3a)'; input.focus(); }
      return;
    }
    state.nickname = name;
    state.order = shuffledOrder(QUESTIONS.length);
    state.index = 0;
    state.selected = new Set();
    state.locked = false;
    state.score = 0;
    state.streak = 0;
    state.perCategory = {};
    state.history = [];
    CATEGORY_KEYS.forEach(k => { state.perCategory[k] = { score: 0, max: 0 }; });
    state.startTime = Date.now();
    state.screen = 'quiz';
    render();
  }

  function currentQuestion() {
    return QUESTIONS[state.order[state.index]];
  }
  function localized(q) {
    return q[state.lang];
  }

  function renderQuiz() {
    const q = currentQuestion();
    const lq = localized(q);
    const total = QUESTIONS.length;
    const progressPct = Math.round((state.index / total) * 100);
    const isMulti = q.correct.length > 1;

    const choiceButtons = lq.choices.map((choiceText, i) => {
      const btn = el('button', { class: 'os-choice', type: 'button' }, [
        el('span', { class: 'os-choice-letter', text: String(i + 1) }),
        el('span', { class: 'os-choice-text', text: choiceText }),
      ]);
      if (state.selected.has(i)) btn.classList.add('selected');
      if (state.locked) {
        btn.disabled = true;
        const isCorrectChoice = q.correct.includes(i);
        if (isCorrectChoice) btn.classList.add('correct');
        else if (state.selected.has(i)) btn.classList.add('incorrect');
      } else {
        btn.addEventListener('click', () => toggleChoice(i, isMulti));
      }
      return btn;
    });

    const bodyChildren = [
      el('div', { class: 'os-category-heading', text: categoryLabel(q.categoryKey) }),
      el('h2', { class: 'os-question-text', text: lq.question }),
    ];
    if (isMulti) bodyChildren.push(el('p', { class: 'os-multi-hint', text: t('multiHint') }));
    bodyChildren.push(el('div', { class: 'os-choices' }, choiceButtons));

    if (state.locked) {
      const wasCorrect = setsEqual(state.selected, new Set(q.correct));
      bodyChildren.push(el('div', { class: 'os-feedback ' + (wasCorrect ? 'correct' : 'incorrect') }, [
        el('div', { class: 'os-feedback-title', text: wasCorrect ? t('correctFeedback') : t('incorrectFeedback') }),
        el('div', { text: lq.explanation }),
      ]));
      if (state.streak >= 3 && wasCorrect) {
        bodyChildren.push(el('div', { class: 'os-streak-note', text: t('streakNote', state.streak) }));
      }
      bodyChildren.push(el('div', { class: 'os-btn-row' }, [
        el('button', { class: 'os-btn-primary', text: state.index + 1 < total ? t('nextBtn') : t('finishBtn'), onclick: nextQuestion }),
      ]));
    } else {
      bodyChildren.push(el('div', { class: 'os-btn-row' }, [
        el('button', { class: 'os-btn-primary', text: t('confirmBtn'), disabled: state.selected.size === 0, onclick: submitAnswer }),
      ]));
    }

    const headerRight = el('div', { class: 'os-header-right' }, [
      debugButton(),
      el('div', { class: 'os-header-stats' }, [
        el('div', { class: 'os-header-stat' }, [
          el('div', { class: 'os-header-stat-label', text: t('pointsLabel') }),
          el('div', { class: 'os-header-stat-value', text: `${state.score} / ${MAX_SCORE}` }),
        ]),
        el('div', { class: 'os-header-stat' }, [
          el('div', { class: 'os-header-stat-label', text: t('streakLabel') }),
          el('div', { class: 'os-header-stat-value', text: String(state.streak) }),
        ]),
      ]),
      langToggleButton(),
    ]);

    return el('div', {}, [
      el('header', { class: 'os-header' }, [
        el('div', { class: 'os-brand', text: t('questionOf', state.index + 1, total) }),
        headerRight,
      ]),
      el('div', { class: 'os-progress-track' }, [
        el('div', { class: 'os-progress-fill', style: `width:${progressPct}%` }),
      ]),
      el('main', { class: 'os-main' }, [
        el('div', { class: 'os-card' }, [
          el('div', { class: 'os-panel' }, bodyChildren),
        ]),
      ]),
    ]);
  }

  function toggleChoice(i, isMulti) {
    if (state.locked) return;
    if (isMulti) {
      if (state.selected.has(i)) state.selected.delete(i);
      else state.selected.add(i);
    } else {
      state.selected = new Set([i]);
    }
    render();
  }

  function setsEqual(a, b) {
    if (a.size !== b.size) return false;
    for (const v of a) if (!b.has(v)) return false;
    return true;
  }

  function submitAnswer() {
    if (state.selected.size === 0) return;
    const q = currentQuestion();
    const lq = localized(q);
    const correctSet = new Set(q.correct);
    const wasCorrect = setsEqual(state.selected, correctSet);
    const points = DIFFICULTY_POINTS[q.difficulty];
    const cat = state.perCategory[q.categoryKey] || (state.perCategory[q.categoryKey] = { score: 0, max: 0 });
    cat.max += points;
    if (wasCorrect) {
      state.score += points;
      cat.score += points;
      state.streak += 1;
    } else {
      state.streak = 0;
    }
    state.history.push({
      category: categoryLabel(q.categoryKey),
      question: lq.question,
      choices: lq.choices,
      selected: Array.from(state.selected).sort((a, b) => a - b),
      correct: q.correct.slice().sort((a, b) => a - b),
      wasCorrect,
      explanation: lq.explanation,
    });
    state.locked = true;
    render();
  }

  function nextQuestion() {
    if (state.index + 1 < QUESTIONS.length) {
      state.index += 1;
      state.selected = new Set();
      state.locked = false;
      render();
    } else {
      finishQuiz();
    }
  }

  function finishQuiz() {
    state.screen = 'result';
    state.durationSeconds = Math.round((Date.now() - state.startTime) / 1000);
    const answeredMax = Object.values(state.perCategory).reduce((s, c) => s + c.max, 0) || MAX_SCORE;
    state.percentScore = Math.round((state.score / answeredMax) * 100);
    state.percentile = null;
    state.leaderboard = null;
    state.leaderboardStatus = isSheetConfigured() ? 'loading' : 'unavailable';
    render();
    if (isSheetConfigured()) loadLeaderboardThenLog();
  }

  function fetchAttemptsJsonp(timeoutMs) {
    // A cross-origin fetch() GET against an Apps Script web app is frequently
    // blocked by CORS (the redirected response often lacks the header), while
    // a <script> tag is exempt from that restriction. doGet returns JSONP
    // when called with a "callback" query parameter.
    return new Promise(resolve => {
      const cbName = 'osQuizCb_' + Math.random().toString(36).slice(2);
      let done = false;
      const script = document.createElement('script');
      const cleanup = () => {
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
      };
      const finish = data => {
        if (done) return;
        done = true;
        cleanup();
        resolve(data);
      };
      window[cbName] = finish;
      const sep = SHEET_WEBHOOK_URL.includes('?') ? '&' : '?';
      script.src = SHEET_WEBHOOK_URL + sep + 'callback=' + cbName;
      script.onerror = () => finish(null);
      document.body.appendChild(script);
      setTimeout(() => finish(null), timeoutMs || 8000);
    });
  }

  function loadLeaderboardThenLog() {
    fetchAttemptsJsonp()
      .then(data => {
        const attempts = (data && Array.isArray(data.attempts)) ? data.attempts : null;
        if (attempts === null) {
          state.leaderboardStatus = 'unavailable';
          render();
          return;
        }
        const priorScores = attempts.map(a => Number(a.percentScore)).filter(n => !isNaN(n));
        const below = priorScores.filter(s => s < state.percentScore).length;
        state.percentile = priorScores.length > 0 ? Math.round((below / priorScores.length) * 100) : 100;

        const board = attempts
          .map(a => ({ nickname: a.nickname, percentScore: Number(a.percentScore), durationSeconds: Number(a.durationSeconds) || 0 }))
          .filter(a => !isNaN(a.percentScore));
        board.push({ nickname: state.nickname, percentScore: state.percentScore, durationSeconds: state.durationSeconds, isMe: true });
        board.sort((a, b) => b.percentScore - a.percentScore || a.durationSeconds - b.durationSeconds);
        state.leaderboard = board.slice(0, 10);
        state.leaderboardStatus = 'ready';
        render();
      })
      .finally(() => {
        postAttempt();
      });
  }

  function postAttempt() {
    if (!isSheetConfigured()) return;
    const payload = {
      timestamp: new Date().toISOString(),
      sessionId: getSessionId(),
      nickname: state.nickname,
      totalScore: state.score,
      maxScore: MAX_SCORE,
      percentScore: state.percentScore,
      durationSeconds: state.durationSeconds,
      categoryScoresJson: JSON.stringify(state.perCategory),
    };
    fetch(SHEET_WEBHOOK_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
    }).catch(() => {});
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }

  function buildSummaryHtml() {
    const rows = state.history.map((h, i) => {
      const choiceLines = h.choices.map((c, ci) => {
        const isSel = h.selected.includes(ci);
        const isCorr = h.correct.includes(ci);
        let marker = '';
        if (isSel && isCorr) marker = ' data-mark="selected-correct"';
        else if (isSel && !isCorr) marker = ' data-mark="selected-wrong"';
        else if (!isSel && isCorr) marker = ' data-mark="correct"';
        return `<li${marker}>${ci + 1}. ${escapeHtml(c)}</li>`;
      }).join('');
      return `
        <section class="q ${h.wasCorrect ? 'ok' : 'no'}">
          <div class="qhead">
            <span class="qnum">${i + 1}</span>
            <span class="qcat">${escapeHtml(h.category)}</span>
            <span class="qverdict">${h.wasCorrect ? t('summaryCorrect') : t('summaryIncorrect')}</span>
          </div>
          <p class="qtext">${escapeHtml(h.question)}</p>
          <ul class="choices">${choiceLines}</ul>
          <p class="explanation">${escapeHtml(h.explanation)}</p>
        </section>`;
    }).join('\n');

    return `<!DOCTYPE html>
<html lang="${state.lang}">
<head>
<meta charset="UTF-8">
<title>${escapeHtml(t('summaryTitle'))}</title>
<style>
  body { font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; background: #f4f7f9; color: #2b333c; margin: 0; padding: 2rem 1.2rem 3rem; }
  h1 { font-size: 20px; margin: 0 0 0.3rem; }
  .meta { color: #6c7884; font-size: 13px; margin-bottom: 1.6rem; }
  .q { max-width: 720px; margin: 0 auto 1.1rem; background: #fff; border: 1px solid #d9e0e6; border-radius: 8px; padding: 1.1rem 1.3rem; }
  .qhead { display: flex; align-items: center; gap: 10px; margin-bottom: 0.6rem; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
  .qnum { color: #6c7884; }
  .qcat { color: #1583ad; flex: 1 1 auto; }
  .q.ok .qverdict { color: #2f8f4e; }
  .q.no .qverdict { color: #b23a3a; }
  .qtext { font-weight: 700; font-size: 14.5px; margin: 0 0 0.7rem; }
  ul.choices { list-style: none; margin: 0 0 0.8rem; padding: 0; font-size: 13px; }
  ul.choices li { padding: 5px 8px; border-radius: 4px; margin-bottom: 4px; }
  ul.choices li[data-mark="selected-correct"] { background: #eaf6ee; color: #1d5c33; font-weight: 700; }
  ul.choices li[data-mark="selected-wrong"] { background: #fbecec; color: #7a2727; font-weight: 700; }
  ul.choices li[data-mark="correct"] { background: #eaf6ee; color: #1d5c33; }
  .explanation { font-size: 12.5px; color: #44505b; margin: 0; }
</style>
</head>
<body>
  <h1>${escapeHtml(t('summaryTitle'))}</h1>
  <div class="meta">${escapeHtml(t('summaryPlayer'))}: ${escapeHtml(state.nickname)} · ${escapeHtml(t('summaryScore'))}: ${state.score}/${MAX_SCORE} (${state.percentScore}%)</div>
  ${rows}
</body>
</html>`;
  }

  function openSummary() {
    const html = buildSummaryHtml();
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
  }

  function renderResults() {
    const bars = CATEGORY_KEYS
      .filter(k => state.perCategory[k] && state.perCategory[k].max > 0)
      .map(k => {
        const cat = state.perCategory[k];
        const pct = Math.round((cat.score / cat.max) * 100);
        return el('div', { class: 'os-bar-row' }, [
          el('div', { class: 'os-bar-label', text: categoryLabel(k) }),
          el('div', { class: 'os-bar-track' }, [
            el('div', { class: 'os-bar-fill', style: `width:${pct}%` }),
          ]),
          el('div', { class: 'os-bar-pct', text: pct + '%' }),
        ]);
      });

    const summaryChildren = [
      el('div', { class: 'os-summary-header', text: t('resultTitle') }),
      el('div', { class: 'os-stats' }, [
        el('div', { class: 'os-stat' }, [
          el('div', { class: 'os-stat-label', text: t('pointsLabel') }),
          el('div', { class: 'os-stat-value' }, [document.createTextNode(`${state.score}/${MAX_SCORE}`)]),
        ]),
        el('div', { class: 'os-stat' }, [
          el('div', { class: 'os-stat-label', text: t('percentLabel') }),
          el('div', { class: 'os-stat-value' }, [document.createTextNode(state.percentScore + '%')]),
        ]),
        el('div', { class: 'os-stat' }, [
          el('div', { class: 'os-stat-label', text: t('percentileLabel') }),
          el('div', { class: 'os-stat-value' }, [
            document.createTextNode(state.percentile === null ? '–' : `${state.percentile}%`),
          ]),
        ]),
        el('div', { class: 'os-stat' }, [
          el('div', { class: 'os-stat-label', text: t('durationLabel') }),
          el('div', { class: 'os-stat-value' }, [document.createTextNode(formatDuration(state.durationSeconds))]),
        ]),
      ]),
    ];
    if (state.percentile !== null) {
      summaryChildren.push(el('p', { class: 'os-info-note', text: t('percentileText', state.percentile) }));
    } else if (state.leaderboardStatus === 'loading') {
      summaryChildren.push(el('p', { class: 'os-info-note', text: t('percentileLoading') }));
    } else if (state.leaderboardStatus === 'unavailable') {
      summaryChildren.push(el('p', { class: 'os-info-note', text: t('percentileUnavailable') }));
    }

    const leaderboardSection = [
      el('div', { class: 'os-section-title', text: t('leaderboardTitle') }),
    ];
    if (state.leaderboardStatus === 'ready' && state.leaderboard) {
      const rows = state.leaderboard.map((row, i) => el('tr', { class: row.isMe ? 'os-me' : '' }, [
        el('td', { text: String(i + 1) }),
        el('td', { text: row.nickname || '–' }),
        el('td', { text: row.percentScore + '%' }),
      ]));
      leaderboardSection.push(el('table', { class: 'os-leaderboard' }, [
        el('thead', {}, [el('tr', {}, [
          el('th', { text: t('tableRank') }), el('th', { text: t('tableName') }), el('th', { text: t('tableResult') }),
        ])]),
        el('tbody', {}, rows),
      ]));
    } else if (state.leaderboardStatus === 'loading') {
      leaderboardSection.push(el('p', { class: 'os-info-note', text: t('leaderboardLoading') }));
    } else {
      leaderboardSection.push(el('p', { class: 'os-info-note', text: t('leaderboardUnavailable') }));
    }

    return el('div', {}, [
      el('header', { class: 'os-header' }, [
        el('div', { class: 'os-brand', text: t('brand') }),
        el('div', { class: 'os-header-right' }, [langToggleButton()]),
      ]),
      el('main', { class: 'os-main' }, [
        el('div', { class: 'os-card' }, [
          el('div', { class: 'os-summary' }, summaryChildren),
          el('div', { class: 'os-panel' }, [
            el('div', { class: 'os-section-title', text: t('categoryBreakdownTitle') }),
            ...bars,
            ...leaderboardSection,
            el('div', { class: 'os-btn-row', style: 'margin-top:1.5rem' }, [
              el('button', { class: 'os-btn-primary', text: t('retryBtn'), onclick: () => { state.screen = 'start'; render(); } }),
              el('button', { class: 'os-btn-secondary', text: t('summaryBtn'), onclick: openSummary }),
            ]),
          ]),
        ]),
      ]),
    ]);
  }

  function formatDuration(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return t('durationFormat', m, s);
  }

  document.addEventListener('keydown', e => {
    if (state.screen !== 'quiz') return;
    const q = currentQuestion();
    if (!state.locked) {
      const num = parseInt(e.key, 10);
      if (!isNaN(num) && num >= 1 && num <= localized(q).choices.length) {
        e.preventDefault();
        toggleChoice(num - 1, q.correct.length > 1);
        return;
      }
      if (e.key === 'Enter' && state.selected.size > 0) {
        e.preventDefault();
        submitAnswer();
      }
    } else if (e.key === 'Enter') {
      e.preventDefault();
      nextQuestion();
    }
  });

  render();
})();
</script>
</body>
</html>
